<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Д дыбысының сиқырлы қазынасы</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(#4a9a4a,#1f5a2a);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-weight:800;color:#4a2a10}
#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#cfe9f7;border-radius:12px}
img{display:block;pointer-events:none;-webkit-user-drag:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
.scr{position:absolute;inset:0;display:none;background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,.4)),var(--bg) center/cover}
.scr.on{display:block}
.abs{position:absolute}
.imgbtn:active{transform:scale(.95)}
/* home */
#home .title{left:320px;top:14px;width:640px;animation:bob 4s ease-in-out infinite}
#home .boy{left:20px;top:290px;height:420px;animation:bob 3s ease-in-out infinite}
#home .girl{right:20px;top:300px;height:410px;animation:bob 3.4s ease-in-out infinite}
#home .chest{left:500px;top:250px;width:280px}
#home .start{left:475px;top:430px;width:330px}
.teams{position:absolute;left:0;right:0;top:545px;text-align:center}
.teams p{margin:0 0 8px;font-size:26px;color:#fff;text-shadow:0 2px 4px #3b2008,0 0 6px #3b2008}
.chip{display:inline-flex;align-items:center;gap:10px;margin:0 8px;padding:0 24px;height:74px;min-width:190px;justify-content:center;font-size:28px;border-radius:40px;background:#fff6dc;border:5px solid #b9783a;box-shadow:0 5px 0 #7a4318,0 8px 14px rgba(0,0,0,.3)}
.chip i{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #7a4318}
.chip.sel{background:#ffe27a;border-color:#2f9a2f;box-shadow:0 0 0 5px #fff,0 5px 0 #2f9a2f,0 0 20px #ffd23a}
@keyframes bob{50%{transform:translateY(-8px)}}
/* hud */
#hud{position:absolute;left:0;right:0;top:0;height:100px;z-index:5}
.pill{position:absolute;left:18px;display:flex;align-items:center;gap:8px;height:42px;padding:0 18px;font-size:24px;color:#fff;border-radius:22px;background:linear-gradient(#9a5a22,#6e3a14);border:3px solid #d9a05b;box-shadow:0 3px 6px rgba(0,0,0,.35)}
#prog{top:8px}#scp{top:54px}
#ttl{position:absolute;left:470px;top:2px;width:340px}
#ttl span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;line-height:1.1;color:#fff;text-shadow:0 2px 3px #4a2208;padding:0 38px 4px}
#board{position:absolute;right:96px;top:6px;width:250px;padding:6px 10px;border-radius:16px;background:linear-gradient(#9a5a22,#6e3a14);border:3px solid #d9a05b;box-shadow:0 3px 6px rgba(0,0,0,.35)}
.tr{display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:12px;font-size:20px;color:#fff;cursor:pointer}
.tr i{width:16px;height:16px;border-radius:50%;border:2px solid #fff}
.tr.act{background:rgba(255,226,122,.35);outline:2px solid #ffe27a}
#snd{position:absolute;right:18px;top:12px;width:70px;height:70px}
#snd.mut img{filter:grayscale(1)}#snd.mut::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#e22}
.ins{position:absolute;left:0;right:0;top:104px;margin:auto;width:fit-content;max-width:900px;padding:8px 30px;font-size:27px;text-align:center;background:rgba(255,255,255,.92);border:4px solid #d9a05b;border-radius:30px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
/* stage 1 */
.grid{position:absolute;left:140px;width:1000px;top:162px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.card{position:relative;width:128px;height:166px;border-radius:14px;filter:drop-shadow(0 5px 6px rgba(0,0,0,.3));transition:transform .15s}
.card:active{transform:scale(.95)}
.card img{width:100%;height:100%}
.card.done{visibility:hidden}
.card::before{content:"";position:absolute;inset:-4px;border-radius:18px;border:5px solid transparent}
.card.bad::before{border-color:#e03030;background:rgba(224,48,48,.2)}
.card.bad{animation:shake .4s}
.card.bad::after{content:"✕";position:absolute;right:-8px;top:-8px;width:40px;height:40px;border-radius:50%;background:#e03030;color:#fff;font-size:26px;display:grid;place-items:center;border:3px solid #fff}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.chestbox{position:absolute;left:0;right:0;top:535px;display:flex;justify-content:center;align-items:center;gap:24px}
.chestbox img{width:230px}.chestbox.hit img{animation:hit .4s}
@keyframes hit{50%{transform:scale(1.15)}}
#cnt{font-size:34px;padding:6px 22px;border-radius:26px;background:#fff;border:4px solid #d9a05b}
.btn{padding:16px 44px;font-size:34px;color:#fff;border-radius:44px;border:5px solid #fff;text-shadow:0 2px 3px rgba(0,0,0,.4);background:linear-gradient(#63d663,#2e9a2e);box-shadow:0 6px 0 #1f6a1f,0 10px 18px rgba(0,0,0,.35);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#nx{position:absolute;left:0;right:0;top:320px;text-align:center;z-index:6}
/* stage 2 */
.cnt2{position:absolute;left:560px;top:160px;width:160px;text-align:center;font-size:24px;padding:4px;border-radius:20px;background:#fff;border:3px solid #d9a05b}
.wordp{position:absolute;left:300px;width:680px;top:212px;height:170px;display:flex;justify-content:center;align-items:center;gap:6px;font-size:118px;border-radius:30px;background:#fffaf0;border:8px solid #b9783a;box-shadow:0 0 0 5px #7a4318,0 10px 20px rgba(0,0,0,.3)}
.wordp .dd{color:#e32323;text-shadow:0 4px 0 #8f1010}
.wordp span{animation:pop .4s backwards}
.doors{position:absolute;left:0;right:0;top:415px;display:flex;justify-content:center;gap:30px}
.door{width:300px}.door img{width:100%}
.door:active{transform:scale(.96)}
.door.glow img{animation:glow .6s 2;filter:drop-shadow(0 0 22px #ffd23a) drop-shadow(0 0 40px #fff)}
.door.shake{animation:shake .4s}
@keyframes glow{50%{transform:scale(1.07)}}
@keyframes pop{from{transform:scale(0)}}
/* stage 3 */
.wood{position:absolute;left:150px;top:170px;width:980px;height:520px;border-radius:30px;background:linear-gradient(#b9783a,#8a5022);border:8px solid #6e3a14;box-shadow:inset 0 0 0 4px #d9a05b,0 12px 24px rgba(0,0,0,.35);padding:22px 36px}
.wood h3{margin:0 0 12px;text-align:center;color:#fff;font-size:30px;text-shadow:0 2px 3px #4a2208}
#bank{min-height:96px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:8px;border-radius:20px;background:rgba(0,0,0,.12)}
.tok{min-width:120px;height:76px;padding:0 24px;font-size:36px;border-radius:18px;background:#fffaf0;border:4px solid #e7c999;box-shadow:0 5px 0 #cda76a;touch-action:none;display:grid;place-items:center;font-weight:800;color:#3a2210}
.tok.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 12px 20px rgba(0,0,0,.4)}
.tok.dim{opacity:.3}
#slots{margin-top:16px;display:flex;gap:14px;justify-content:center;padding:20px 12px;border-radius:22px;background:#fbf2dc;border:3px solid #e7c999}
#slots.okk{background:#d8f6cf;border-color:#3aa33a}
.slot{width:150px;height:84px;border:4px dashed #c9a56a;border-radius:18px;display:grid;place-items:center}
#msg{margin-top:12px;height:70px;text-align:center;font-size:48px;color:#fff;text-shadow:0 3px 4px #3a1a05}
#chk{text-align:center;margin-top:6px}#chk img{width:250px;margin:auto}
/* fb */
.fb{position:absolute;left:50%;top:96px;transform:translateX(-50%);z-index:60;pointer-events:none;animation:fbin 1.3s forwards}
.fb img{width:440px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.sp{position:absolute;font-size:34px;animation:spk 1.1s forwards}
@keyframes fbin{0%{transform:translateX(-50%) scale(.3);opacity:0}20%{transform:translateX(-50%) scale(1.08);opacity:1}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@keyframes spk{from{transform:scale(0) rotate(0)}40%{transform:scale(1.2) rotate(90deg);opacity:1}to{transform:scale(0) translateY(-40px);opacity:0}}
/* result */
#result .rays{position:absolute;left:180px;top:120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0,rgba(255,230,120,.6) 40%,transparent 70%);animation:pulse 2s infinite}
#result .chestO{left:110px;top:200px;width:480px}
#result .medal{right:120px;top:215px;width:240px;animation:bob 2.5s infinite}
#result h1{position:absolute;left:0;right:0;top:8px;margin:0;text-align:center;font-size:84px;color:#fff;text-shadow:0 5px 0 #d4811a,0 8px 12px rgba(0,0,0,.4);-webkit-text-stroke:3px #c9701a;animation:pop .6s}
#result h2{position:absolute;left:0;right:0;top:108px;margin:0;text-align:center;font-size:40px;color:#fff;text-shadow:0 3px 4px #3a1a05}
.sc{position:absolute;left:0;right:0;top:170px;text-align:center;font-size:38px}
.sc b{padding:8px 30px;border-radius:30px;background:#fff;border:4px solid #d9a05b;font-size:38px}
.sc small{display:block;margin-top:8px;font-size:22px;color:#fff;text-shadow:0 2px 3px #3a1a05}
.cap{position:absolute;right:70px;top:470px;width:340px;padding:8px 14px;text-align:center;font-size:25px;line-height:1.15;color:#fff;border-radius:22px;background:linear-gradient(#9a5a22,#6e3a14);border:3px solid #d9a05b}
.rb{position:absolute;bottom:22px;display:flex;gap:40px;left:0;right:0;justify-content:center}
.rb img{width:280px}
.fall{position:absolute;top:-50px;font-size:34px;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(800px) rotate(360deg)}}
</style></head><body>
<div id="stage">
 <section id="home" class="scr on">
  <img class="abs title" data-a="title"><img class="abs boy" data-a="boy"><img class="abs girl" data-a="girl">
  <img class="abs chest" data-a="chest">
  <button class="abs imgbtn start" id="startBtn"><img data-a="start"></button>
  <div class="teams"><p>Топ таңдаңыз:</p><div id="chips"></div></div>
 </section>
 <section id="game" class="scr">
  <div id="hud">
   <div class="pill" id="prog"></div><div class="pill" id="scp">⭐ Ұпай: <span id="sc">0</span></div>
   <div id="ttl"><img data-a="plank" style="width:100%"><span id="ttlt"></span></div>
   <div id="board"></div>
   <button id="snd"><img data-a="snd" style="width:100%"></button>
  </div>
  <div id="body"></div><div id="nx"></div>
 </section>
 <section id="result" class="scr">
  <div class="rays"></div><img class="abs chestO" data-a="chestopen"><img class="abs medal" data-a="medal">
  <h1>🎉 ЖАРАЙСЫҢ!</h1><h2>Сен Д дыбысының шеберісің!</h2>
  <div class="sc"><b>⭐ Жиналған ұпай: <span id="fs">0</span></b><small id="ft"></small></div>
  <div class="cap">🏆 Д дыбысының<br>үздік зерттеушісі</div>
  <div class="rb"><button class="imgbtn" id="homeBtn"><img data-a="home"></button><button class="imgbtn" id="replayBtn"><img data-a="replay"></button></div>
 </section>
</div>

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const TEAMS=[['ДАНА','#2f7fe0'],['ДАЛА','#3aa33a'],['ДОС','#f2b705']];
const S={currentStage:0,score:0,selectedTeam:null,currentQuestion:0,soundEnabled:true,completedStages:[],teams:{ДАНА:0,ДАЛА:0,ДОС:0}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const img=(k,c='')=>`<img class="${c}" src="${A[k]}" alt="">`;
const body=$('#body'),stage=$('#stage');
document.documentElement.style.setProperty('--bg',`url("${A.bg}")`);
$$('[data-a]').forEach(e=>e.src=A[e.dataset.a]);
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`;stage.style.left=(innerWidth-1280*s)/2+'px';stage.style.top=(innerHeight-720*s)/2+'px'}
addEventListener('resize',fit);fit();
/* sound */
let ac;function tone(f,d=.15,t='sine',at=0,v=.14){if(!S.soundEnabled)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+at;o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
const sfx={ok:()=>{tone(660,.12);tone(880,.2,'sine',.1)},bad:()=>tone(200,.3,'triangle'),win:()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'sine',i*.12))};
$('#snd').onclick=e=>{S.soundEnabled=!S.soundEnabled;e.currentTarget.classList.toggle('mut',!S.soundEnabled);sfx.ok()};
/* ui helpers */
function show(id){$$('.scr').forEach(s=>s.classList.toggle('on',s.id===id))}
const getScore=()=>S.selectedTeam?S.teams[S.selectedTeam]:S.score;
function addPoint(){S.selectedTeam?S.teams[S.selectedTeam]++:S.score++;updateHUD()}
const TT={1:'1-кезең. Д дыбысын тап',2:'2-кезең. Д дыбысы қай жерде?',3:'3-кезең. Сөйлемді құрастыр'};
function updateHUD(){
 $('#prog').innerHTML=`${S.currentStage} / 3 &nbsp;${[1,2,3].map(n=>S.completedStages.includes(n)?'⭐':'○').join('')}`;
 $('#sc').textContent=getScore();$('#ttlt').textContent=TT[S.currentStage]||'';
 const b=$('#board');b.style.display=S.selectedTeam?'block':'none';
 b.innerHTML=TEAMS.map(([n,c])=>`<div class="tr ${n===S.selectedTeam?'act':''}" data-t="${n}"><i style="background:${c}"></i>${n} ⭐ ${S.teams[n]}</div>`).join('');
}
$('#board').onclick=e=>{const t=e.target.closest('.tr');if(t){S.selectedTeam=t.dataset.t;updateHUD()}};
function toast(ok){
 $$('.fb,.sp').forEach(e=>e.remove());
 const d=document.createElement('div');d.className='fb';d.innerHTML=img(ok?'ok':'bad');stage.appendChild(d);
 const L=[d];
 if(ok)for(let i=0;i<9;i++){const s=document.createElement('span');s.className='sp';s.textContent=['✨','⭐','✨'][i%3];s.style.left=(440+Math.random()*400)+'px';s.style.top=(90+Math.random()*90)+'px';s.style.animationDelay=Math.random()*.4+'s';stage.appendChild(s);L.push(s)}
 setTimeout(()=>L.forEach(e=>e.remove()),1400);
}
function showNext(n){$('#nx').innerHTML=`<button class="btn" id="nb">${n}-кезең аяқталды! ▶</button>`;S.completedStages.push(n);updateHUD();sfx.win();$('#nb').onclick=()=>n===1?startStage2():startStage3()}
/* flow */
function startGame(){S.currentStage=1;S.completedStages=[];show('game');startStage1()}
function startStage1(){
 S.currentStage=1;S.currentQuestion=0;$('#nx').innerHTML='';updateHUD();
 const W=[['Дана',1],['дала',1],['адам',1],['домбыра',1],['долана',1],['дуадақ',1],['Дулат',1],['Ардақ',1],['алма',0]];let found=0;
 body.innerHTML=`<div class="ins">Д дыбысы бар сөздерді таңдап, қазына сандығына жина!</div><div class="grid">${shuffle(W).map(([w,o])=>`<button class="card" data-o="${o}">${img('w_'+w)}</button>`).join('')}</div><div class="chestbox" id="cb">${img('chest')}<span id="cnt">0 / 8</span></div>`;
 $('.grid').onclick=e=>{
  const c=e.target.closest('.card');if(!c||c.classList.contains('done')||c.classList.contains('bad'))return;
  if(c.dataset.o==='1'){
   found++;addPoint();sfx.ok();toast(true);fly(c);c.classList.add('done');$('#cnt').textContent=found+' / 8';
   if(found===8)setTimeout(()=>showNext(1),800);
  }else{c.classList.add('bad');sfx.bad();toast(false);setTimeout(()=>c.classList.remove('bad'),900)}
 };
}
function fly(c){
 const r=c.getBoundingClientRect(),t=$('#cb img').getBoundingClientRect(),k=c.querySelector('img').cloneNode();
 Object.assign(k.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',zIndex:70});document.body.appendChild(k);
 const dx=t.left+t.width/2-r.left-r.width/2,dy=t.top+t.height*.35-r.top-r.height/2;
 k.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy-80}px) scale(.8) rotate(8deg)`,offset:.4},{transform:`translate(${dx}px,${dy}px) scale(.25)`,opacity:.3}],{duration:800,easing:'ease-in'}).onfinish=()=>{k.remove();const b=$('#cb');if(b){b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit')}};
}
function startStage2(){
 S.currentStage=2;$('#nx').innerHTML='';updateHUD();
 const q=shuffle([['ДАНА',[0]],['АДАМ',[1]],['КОД',[2]],['ДАРА',[0]],['ДОС',[0]],['ДАЛА',[0]],['ДОЛАНА',[0]],['ДУАДАҚ',[0,1]],['АРДАҚ',[1]],['ДУЛАТ',[0]],['ДОДА',[0,1]]]);
 let i=0,busy=false;
 const round=()=>{
  if(i>=q.length){body.innerHTML='<div class="ins">Тамаша! Барлық сөздерді дұрыс таптың!</div>';return showNext(2)}
  S.currentQuestion=i;busy=false;const[w,ans]=q[i];
  body.innerHTML=`<div class="ins">Д дыбысы сөздің қай жерінде?</div><div class="cnt2">${i+1} / ${q.length}</div><div class="wordp">${[...w].map((c,n)=>`<span class="${c==='Д'?'dd':''}" style="animation-delay:${n*.06}s">${c}</span>`).join('')}</div><div class="doors">${[1,2,3].map(n=>`<button class="door" data-i="${n-1}">${img('door'+n)}</button>`).join('')}</div>`;
  $('.doors').onclick=e=>{
   const d=e.target.closest('.door');if(!d||busy)return;
   if(ans.includes(+d.dataset.i)){busy=true;d.classList.add('glow');addPoint();sfx.ok();toast(true);setTimeout(()=>{i++;round()},1500)}
   else{d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');sfx.bad();toast(false)}
  };
 };round();
}
const SENT=[
 {t:['Дана','далада','.'],ok:a=>a.join('|')==='Дана|далада|.',fmt:a=>`${a[0]} ${a[1]}.`},
 {t:['Дулат','далада','.'],ok:a=>a.join('|')==='Дулат|далада|.',fmt:a=>`${a[0]} ${a[1]}.`},
 {t:['Атасы','дана','адам','.'],ok:a=>a.join('|')==='Атасы|дана|адам|.',fmt:a=>`${a[0]} – ${a[1]} ${a[2]}.`}];
function startStage3(){
 S.currentStage=3;$('#nx').innerHTML='';updateHUD();let n=0;
 const next=()=>{
  if(n>=SENT.length){S.completedStages.push(3);return showResult()}
  S.currentQuestion=n;const P=SENT[n];let order,slots=P.t.map(()=>null),done=false;
  do{order=shuffle(P.t.map((_,i)=>i))}while(P.ok(order.map(i=>P.t[i])));
  body.innerHTML=`<div class="wood"><h3>Сөздерді дұрыс ретпен орналастыр.</h3><div id="bank"></div><div id="slots"></div><div id="msg"></div><div id="chk"><button class="imgbtn" id="cb3">${img('check')}</button></div></div><div class="cnt2" style="top:108px;left:560px">${n+1} / ${SENT.length}</div>`;
  const tok=i=>`<div class="tok" data-i="${i}">${P.t[i]}</div>`;
  const render=()=>{
   $('#bank').innerHTML=order.filter(i=>!slots.includes(i)).map(tok).join('');
   $('#slots').innerHTML=slots.map((v,s)=>`<div class="slot" data-slot="${s}">${v===null?'':tok(v)}</div>`).join('');
   if(!done)$$('.tok',body).forEach(bind);
  };
  const place=(i,s)=>{const old=slots[s];slots=slots.map(v=>v===i?null:v);slots[s]=i};
  const unplace=i=>{slots=slots.map(v=>v===i?null:v)};
  const clickMove=i=>{if(slots.includes(i))unplace(i);else{const f=slots.indexOf(null);if(f>-1)slots[f]=i}render()};
  function bind(el){
   el.onpointerdown=e=>{
    e.preventDefault();const i=+el.dataset.i,sx=e.clientX,sy=e.clientY;let g=null;
    const mv=ev=>{
     if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){g=el.cloneNode(true);g.classList.add('ghost');document.body.appendChild(g);el.classList.add('dim')}
     if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'}
    };
    const up=ev=>{
     removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
     if(!g){clickMove(i);return}
     g.remove();const t=document.elementFromPoint(ev.clientX,ev.clientY),sl=t&&t.closest('[data-slot]');
     if(sl)place(i,+sl.dataset.slot);else unplace(i);render();
    };
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
   };
  }
  render();
  $('#cb3').onclick=()=>{
   if(done)return;
   if(slots.includes(null)){$('#msg').textContent='Барлық сөзді орналастыр!';return}
   const a=slots.map(i=>P.t[i]);
   if(P.ok(a)){done=true;addPoint();sfx.ok();toast(true);$('#slots').classList.add('okk');$('#msg').textContent=P.fmt(a);$$('.tok',body).forEach(t=>t.onpointerdown=null);
    $('#chk').innerHTML=`<button class="btn" id="nb3">${n+1<SENT.length?'Келесі ▶':'Нәтижені көру ▶'}</button>`;$('#nb3').onclick=()=>{n++;next()}}
   else{sfx.bad();toast(false);$('#msg').textContent=''}
  };
 };next();
}
function showResult(){
 updateHUD();show('result');$('#fs').textContent=getScore();
 $('#ft').textContent=S.selectedTeam?TEAMS.map(([n])=>`${n} ⭐ ${S.teams[n]}`).join('   '):'';
 $$('.fall').forEach(e=>e.remove());sfx.win();
 for(let i=0;i<26;i++){const f=document.createElement('div');f.className='fall';f.textContent=['⭐','✨','🌟'][i%3];f.style.left=Math.random()*1240+'px';f.style.animationDuration=(3+Math.random()*3)+'s';f.style.animationDelay=-Math.random()*5+'s';$('#result').appendChild(f)}
}
function resetGame(){S.currentStage=0;S.score=0;S.currentQuestion=0;S.completedStages=[];S.teams={ДАНА:0,ДАЛА:0,ДОС:0};$('#nx').innerHTML='';$$('.fall,.fb,.sp').forEach(e=>e.remove());updateHUD()}
function renderChips(){
 $('#chips').innerHTML=TEAMS.map(([n,c])=>`<button class="chip ${S.selectedTeam===n?'sel':''}" data-t="${n}"><i style="background:${c}"></i>${n} тобы</button>`).join('')+`<button class="chip ${S.selectedTeam?'':'sel'}" data-t="">👤 Жеке ойнау</button>`;
}
$('#chips').onclick=e=>{const c=e.target.closest('.chip');if(c){S.selectedTeam=c.dataset.t||null;renderChips()}};
$('#startBtn').onclick=()=>{resetGame();startGame()};
$('#homeBtn').onclick=()=>{resetGame();renderChips();show('home')};
$('#replayBtn').onclick=()=>{resetGame();startGame()};
renderChips();updateHUD();
</script></body></html>
